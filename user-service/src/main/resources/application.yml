kafka.topic:
  user-random-topic: user-random-topic
  user-created-topic: user-created-topic

spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all   # Ensures the message is acknowledged only after all in-sync replicas have received it (highest durability, safest but slightly slower)
      retries: 3  # Number of times the producer will retry sending a message if it fails before giving up
      properties:
        schema:
          registry:
            url: "http://127.0.0.1:8081"
